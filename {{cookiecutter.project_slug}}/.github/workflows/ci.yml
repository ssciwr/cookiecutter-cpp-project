name: CI

on:
  # We run CI on pushes to the main branch
  push:
    branches:
      - main
  # and on all pull requests to the main branch
  pull_request:
    branches:
      - main
  # as well as upon manual triggers through the 'Actions' tab of the Github UI
  workflow_dispatch:

jobs:
  build-and-test:
    name: Testing on ${{ "{{matrix.os}}" }}
    runs-on: ${{ "{{matrix.os}}" }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7
{% if cookiecutter.use_submodules == "Yes" %}
      with:
        submodules: 'recursive'
{% endif %}
{% if cookiecutter.doxygen == "Yes" %}

    - name: Install Doxygen
      uses: ssciwr/doxygen-install@v2
{% endif %}

    - name: Configure cmake
      shell: bash
      run: cmake --preset test

    - name: Build
      shell: bash
      run: cmake --build --preset test

    - name: Run tests
      shell: bash
      run: ctest --preset test
{% if cookiecutter.python_bindings != "None" %}

  python-testing:
    name: Python package testing on ${{ "{{matrix.os}}" }}
    runs-on: ${{ "{{matrix.os}}" }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7
{% if cookiecutter.use_submodules == "Yes" %}
      with:
        submodules: 'recursive'
{% endif %}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
{% if cookiecutter.doxygen == "Yes" %}

    - name: Install Doxygen
      uses: ssciwr/doxygen-install@v2
{% endif %}

    - name: Run Python tests
      shell: bash
      run: |
        python -m pip install .
        python -m pip install -r requirements-dev.txt
        pytest
{% endif %}
{% if cookiecutter.codecovio == "Yes" %}

  coverage-test:
    name: Coverage Testing
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
{% if cookiecutter.use_submodules == "Yes" %}
      with:
        submodules: 'recursive'
{% endif %}

    - name: Install LCov
      run: |
        sudo apt-get install -y lcov
{% if cookiecutter.doxygen == "Yes" %}

    - name: Install Doxygen
      uses: ssciwr/doxygen-install@v2
{% endif %}
{% if cookiecutter.python_bindings != "None" %}

    - name: Install Python package editable
      run: |
        python -m pip install scikit_build_core {{ "pybind11[global]" if cookiecutter.python_bindings == "pybind11" else "nanobind[global]" }}
        python -m pip install --no-build-isolation --config-settings=build-dir="${{ "{{ github.workspace }}" }}/build" --config-settings=cmake.define.CMAKE_CXX_FLAGS="--coverage" --config-settings=cmake.define.BUILD_TESTING="ON" -v -e .
        python -m pip install -r requirements-dev.txt

    - name: Run Python tests
      run: |
        python -m pytest --cov --cov-report=xml
{% else %}

    - name: Configure cmake
      shell: bash
      run: |
        cmake --preset test \
          -DCMAKE_CXX_FLAGS="--coverage -fprofile-update=atomic -O0 -g" \
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

    - name: Build
      shell: bash
      run: cmake --build --preset test
{% endif %}

    - name: Run tests
      shell: bash
      run: ctest --preset test

    - name: Collect coverage report
      shell: bash
      working-directory: ${{ "{{ github.workspace }}" }}
      run: |
        lcov --directory ./build/test{{ "/src" if cookiecutter.header_only == "No" }} --capture --output-file coverage.info --ignore-errors mismatch,unused --exclude '*/catch2/*'

    - name: Upload C++ coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: true
        files: ${{ "{{github.workspace}}" }}/coverage.info{% if cookiecutter.python_bindings != "None" %},coverage.xml{% endif %}
{% endif %}

